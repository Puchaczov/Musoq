<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
<title id="title">How execution time scales with input size</title>
<desc id="description">Mean execution time at 1,000, 10,000 and 100,000 input rows. Both axes use logarithmic scales. Timing whiskers show the observed minimum and maximum. Sales reporting averaged 0.021 ms at 1,000 rows (0.021–0.022 ms observed), 0.264 ms at 10,000 rows (0.243–0.295 ms observed), 4.249 ms at 100,000 rows (3.914–4.551 ms observed). Join + windows averaged 0.185 ms at 1,000 rows (0.180–0.189 ms observed), 2.713 ms at 10,000 rows (2.586–2.809 ms observed), 27.502 ms at 100,000 rows (26.588–28.720 ms observed). Log analytics averaged 0.075 ms at 1,000 rows (0.074–0.076 ms observed), 0.847 ms at 10,000 rows (0.826–0.870 ms observed), 11.760 ms at 100,000 rows (11.494–12.088 ms observed). Packet analytics averaged 0.378 ms at 1,000 rows (0.356–0.409 ms observed), 5.467 ms at 10,000 rows (5.246–5.755 ms observed), 72.455 ms at 100,000 rows (65.828–79.488 ms observed). </desc>
