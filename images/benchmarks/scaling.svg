<text x="32.00" y="65.00" font-size="14" fill="#334155" text-anchor="start" font-weight="400">Musoq 17.0.23 | Synthetic in-memory inputs | Table results fully consumed</text>
<text x="32.00" y="96.00" font-size="12" fill="#334155" text-anchor="start" font-weight="400">Mean milliseconds | Lower is better | Both axes logarithmic; lines connect measured points</text>
