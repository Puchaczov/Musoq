<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
<title id="title">How execution time scales with input size</title>
<desc id="description">Mean execution time at 1,000, 10,000 and 100,000 input rows. Both axes use logarithmic scales. Sales reporting: 1,000 rows = 0.021 ms, 10,000 rows = 0.268 ms, 100,000 rows = 4.225 ms. Join + windows: 1,000 rows = 0.242 ms, 10,000 rows = 3.418 ms, 100,000 rows = 34.783 ms. Log analytics: 1,000 rows = 0.077 ms, 10,000 rows = 0.874 ms, 100,000 rows = 11.649 ms. Packet analytics: 1,000 rows = 0.373 ms, 10,000 rows = 5.457 ms, 100,000 rows = 72.902 ms. </desc>
