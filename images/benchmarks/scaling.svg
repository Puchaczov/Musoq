<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
<title id="title">How execution time scales with input size</title>
<desc id="description">Mean execution time at 1,000, 10,000 and 100,000 input rows. Both axes use logarithmic scales. Sales reporting: 1,000 rows = 0.022 ms, 10,000 rows = 0.276 ms, 100,000 rows = 4.083 ms. Join + windows: 1,000 rows = 0.324 ms, 10,000 rows = 4.252 ms, 100,000 rows = 45.079 ms. Log analytics: 1,000 rows = 0.092 ms, 10,000 rows = 0.965 ms, 100,000 rows = 12.863 ms. Packet analytics: 1,000 rows = 0.410 ms, 10,000 rows = 6.074 ms, 100,000 rows = 74.637 ms. </desc>
