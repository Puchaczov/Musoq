<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
<title id="title">How execution time scales with input size</title>
<desc id="description">Mean execution time at 1,000, 10,000 and 100,000 input rows. Both axes use logarithmic scales. Sales reporting: 1,000 rows = 0.021 ms, 10,000 rows = 0.264 ms, 100,000 rows = 4.249 ms. Join + windows: 1,000 rows = 0.185 ms, 10,000 rows = 2.713 ms, 100,000 rows = 27.502 ms. Log analytics: 1,000 rows = 0.075 ms, 10,000 rows = 0.847 ms, 100,000 rows = 11.760 ms. Packet analytics: 1,000 rows = 0.378 ms, 10,000 rows = 5.467 ms, 100,000 rows = 72.455 ms. </desc>
