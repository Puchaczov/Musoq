<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
<title id="title">How execution time scales with input size</title>
<desc id="description">Mean execution time at 1,000, 10,000 and 100,000 input rows. Both axes use logarithmic scales. Sales reporting: 1,000 rows = 0.021 ms, 10,000 rows = 0.267 ms, 100,000 rows = 4.296 ms. Join + windows: 1,000 rows = 0.237 ms, 10,000 rows = 3.406 ms, 100,000 rows = 34.545 ms. Log analytics: 1,000 rows = 0.083 ms, 10,000 rows = 0.934 ms, 100,000 rows = 12.381 ms. Packet analytics: 1,000 rows = 0.373 ms, 10,000 rows = 5.430 ms, 100,000 rows = 71.936 ms. </desc>
