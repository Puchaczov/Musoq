name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate as a dry run, for example parser/v17.0.1-preview.1
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'
      - '*/v*.*.*'

permissions:
  contents: read

jobs:
  validate-pack:
    name: Validate and pack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
      release_notes_path: ${{ steps.release.outputs.release_notes_path }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
      is_dry_run: ${{ steps.release.outputs.is_dry_run }}

    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # actions/setup-dotnet@v4.3.1
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'

      # actions/cache@v4.2.4
      - name: Cache NuGet packages
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props', 'scripts/Versions.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Validate release tag
        id: release
        shell: pwsh
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_EVENT_NAME -eq 'workflow_dispatch') {
            $tag = $env:RELEASE_INPUT_TAG
            $isDryRun = 'true'
          }
          else {
            $tag = $env:RELEASE_REF_NAME
            $isDryRun = 'false'
          }

          $validateScript = Join-Path $env:GITHUB_WORKSPACE 'scripts/release/Validate-Release.ps1'
          $summaryJson = & $validateScript -Tag $tag -Json
          $summary = $summaryJson | ConvertFrom-Json

          "release_tag=$($summary.tag)" >> $env:GITHUB_OUTPUT
          "release_version=$($summary.version)" >> $env:GITHUB_OUTPUT
          "release_notes_path=release-notes/$($summary.tag).md" >> $env:GITHUB_OUTPUT
          "is_prerelease=$($summary.isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "is_dry_run=$isDryRun" >> $env:GITHUB_OUTPUT

      - name: Require successful CI for exact release commit
        shell: pwsh
        env:
          CI_WORKFLOW: ci.yml
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          $releaseSha = (git rev-parse "$($env:RELEASE_TAG)^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($releaseSha)) {
            throw "Could not resolve release tag '$($env:RELEASE_TAG)' to a commit."
          }

          $checkedOutSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($checkedOutSha)) {
            throw 'Could not resolve the checked-out commit.'
          }

          if ($checkedOutSha -ne $releaseSha) {
            throw "Checked-out commit $checkedOutSha does not match release tag '$($env:RELEASE_TAG)' at $releaseSha."
          }

          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $($env:GITHUB_TOKEN)"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "$($env:GITHUB_API_URL)/repos/$($env:GITHUB_REPOSITORY)/actions/workflows/$($env:CI_WORKFLOW)/runs?head_sha=$releaseSha&event=push&status=completed&per_page=100"

          $successfulRun = $null
          $lastApiError = $null
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              $runs = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers
              $lastApiError = $null
              $successfulRun = @($runs.workflow_runs | Where-Object {
                  $_.head_sha -eq $releaseSha -and
                  $_.event -eq 'push' -and
                  $_.conclusion -eq 'success'
                }) | Sort-Object { [DateTimeOffset]$_.updated_at } -Descending | Select-Object -First 1

              if ($null -ne $successfulRun) {
                break
              }
            }
            catch {
              $lastApiError = $_
            }

            if ($attempt -lt 3) {
              Write-Host "CI success evidence is not available yet; retrying in 5 seconds (attempt $($attempt + 1) of 3)."
              Start-Sleep -Seconds 5
            }
          }

          if ($null -eq $successfulRun) {
            if ($null -ne $lastApiError) {
              throw "Could not query CI workflow runs for release commit $releaseSha. $($lastApiError.Exception.Message)"
            }

            throw "No successful CI push run found for release tag '$($env:RELEASE_TAG)' at commit $releaseSha."
          }

          Write-Host "Using successful CI run $($successfulRun.id) for release commit $releaseSha."

      - name: Restore
        run: dotnet restore src/dotnet/Musoq.sln --nologo --verbosity quiet

      - name: Build
        run: dotnet build src/dotnet/Musoq.sln --configuration Release --no-restore --nologo --verbosity quiet

      - name: Pack selected packages
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          $packScript = Join-Path $env:GITHUB_WORKSPACE 'scripts/release/Pack-Release.ps1'
          $outputPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts/nupkgs'
          & $packScript -Tag $env:RELEASE_TAG -OutputPath $outputPath

      - name: Smoke test selected packages
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          $smokeScript = Join-Path $env:GITHUB_WORKSPACE 'scripts/release/Test-PackageSmoke.ps1'
          $packageDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts/nupkgs'
          & $smokeScript -Tag $env:RELEASE_TAG -PackageDirectory $packageDirectory

      # actions/upload-artifact@v4.6.2
      - name: Upload package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-packages
          path: artifacts/nupkgs/*
          if-no-files-found: error

  publish:
    name: Publish to NuGet
    needs: validate-pack
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: nuget-production
    permissions:
      contents: write
      id-token: write

    steps:
      # actions/checkout@v4.2.2
      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate-pack.outputs.release_tag }}
          sparse-checkout: |
            release-notes
          sparse-checkout-cone-mode: false

      - name: Resolve release notes
        id: release-notes
        shell: pwsh
        env:
          RELEASE_NOTES_PATH: ${{ needs.validate-pack.outputs.release_notes_path }}
        run: |
          if (Test-Path -LiteralPath $env:RELEASE_NOTES_PATH) {
            "exists=true" >> $env:GITHUB_OUTPUT
          }
          else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }

      # actions/download-artifact@v4.3.0
      - name: Download package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-packages
          path: artifacts/nupkgs

      # NuGet/login@v1
      - name: NuGet login with Trusted Publishing
        id: nuget-login
        continue-on-error: true
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages to NuGet.org
        shell: pwsh
        env:
          TRUSTED_NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          FALLBACK_NUGET_API_KEY: ${{ secrets.NUGET_MUSOQ_KEY }}
        run: |
          $apiKey = $env:TRUSTED_NUGET_API_KEY
          if ([string]::IsNullOrWhiteSpace($apiKey)) {
            $apiKey = $env:FALLBACK_NUGET_API_KEY
          }

          if ([string]::IsNullOrWhiteSpace($apiKey)) {
            throw 'NuGet publishing credential is unavailable. Configure Trusted Publishing or NUGET_MUSOQ_KEY.'
          }

          $manifestPath = Join-Path 'artifacts/nupkgs' 'release-package-files.txt'
          if (-not (Test-Path -LiteralPath $manifestPath)) {
            throw 'Release package manifest was not found.'
          }

          $packageFiles = Get-Content -LiteralPath $manifestPath |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
            ForEach-Object { Split-Path -Leaf $_ } |
            ForEach-Object { Join-Path 'artifacts/nupkgs' $_ }

          foreach ($packageFile in $packageFiles) {
            if (-not (Test-Path -LiteralPath $packageFile)) {
              throw 'Release package listed in the manifest was not found.'
            }

            dotnet nuget push $packageFile --api-key $apiKey --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              throw 'NuGet push failed.'
            }
          }

      # softprops/action-gh-release@v2.2.2
      - name: Create GitHub Release with curated notes
        if: steps.release-notes.outputs.exists == 'true'
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          tag_name: ${{ needs.validate-pack.outputs.release_tag }}
          name: Release ${{ needs.validate-pack.outputs.release_tag }}
          prerelease: ${{ needs.validate-pack.outputs.is_prerelease }}
          body_path: ${{ needs.validate-pack.outputs.release_notes_path }}
          generate_release_notes: false
          files: |
            artifacts/nupkgs/*.nupkg
            artifacts/nupkgs/*.snupkg

      # softprops/action-gh-release@v2.2.2
      - name: Create GitHub Release with generated notes
        if: steps.release-notes.outputs.exists != 'true'
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          tag_name: ${{ needs.validate-pack.outputs.release_tag }}
          name: Release ${{ needs.validate-pack.outputs.release_tag }}
          prerelease: ${{ needs.validate-pack.outputs.is_prerelease }}
          generate_release_notes: true
          files: |
            artifacts/nupkgs/*.nupkg
            artifacts/nupkgs/*.snupkg
