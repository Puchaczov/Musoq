name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - master
      - 'release/**'
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.github/workflows/update-badge.yml'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.github/workflows/update-badge.yml'

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux validation (primary)
            os: ubuntu-latest
            artifact_name: trx-linux
            warning_ratchet: true
          - name: Windows validation
            os: windows-latest
            artifact_name: trx-windows
            warning_ratchet: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props', 'scripts/Versions.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore src/dotnet/Musoq.sln

      - name: Restore development tools
        run: dotnet tool restore

      - name: Check code formatting
        run: dotnet csharpier check .

      - name: Build
        run: dotnet build src/dotnet/Musoq.sln --configuration Release --no-restore

      - name: Enforce warning ratchet
        if: matrix.warning_ratchet == true
        shell: bash
        run: |
          dotnet build src/dotnet/Musoq.Parser/Musoq.Parser.csproj --configuration Release --no-restore --no-dependencies -warnaserror
          dotnet build src/dotnet/Musoq.Parser.Tests/Musoq.Parser.Tests.csproj --configuration Release --no-restore --no-dependencies -warnaserror
          dotnet build src/dotnet/Musoq.Formatter/Musoq.Formatter.csproj --configuration Release --no-restore --no-dependencies -warnaserror
          dotnet build src/dotnet/Musoq.Formatter.Tests/Musoq.Formatter.Tests.csproj --configuration Release --no-restore --no-dependencies -warnaserror
          dotnet build src/dotnet/Musoq.Schema/Musoq.Schema.csproj --configuration Release --no-restore --no-dependencies -warnaserror
          dotnet build src/dotnet/Musoq.Schema.Tests/Musoq.Schema.Tests.csproj --configuration Release --no-restore --no-dependencies -warnaserror
          dotnet build src/dotnet/Musoq.Plugins/Musoq.Plugins.csproj --configuration Release --no-restore --no-dependencies -warnaserror
          dotnet build src/dotnet/Musoq.Plugins.Conversions.Tests/Musoq.Plugins.Conversions.Tests.csproj --configuration Release --no-restore --no-dependencies -warnaserror
          dotnet build src/dotnet/Musoq.Plugins.Functions.Tests/Musoq.Plugins.Functions.Tests.csproj --configuration Release --no-restore --no-dependencies -warnaserror
          dotnet build src/dotnet/Musoq.Plugins.Tests.Common/Musoq.Plugins.Tests.Common.csproj --configuration Release --no-restore --no-dependencies -warnaserror
          dotnet build src/dotnet/Musoq.Tests.Common/Musoq.Tests.Common.csproj --configuration Release --no-restore --no-dependencies -warnaserror
          dotnet build src/dotnet/Musoq.Evaluator/Musoq.Evaluator.csproj --configuration Release --no-restore --no-dependencies -warnaserror
          dotnet build src/dotnet/Musoq.Converter/Musoq.Converter.csproj --configuration Release --no-restore --no-dependencies -warnaserror
          dotnet build src/dotnet/Musoq.Converter.Compilation.Tests/Musoq.Converter.Compilation.Tests.csproj --configuration Release --no-restore --no-dependencies -warnaserror
          dotnet build src/dotnet/Musoq.Converter.Inspection.Tests/Musoq.Converter.Inspection.Tests.csproj --configuration Release --no-restore --no-dependencies -warnaserror
          dotnet build src/dotnet/Musoq.Converter.Targets.Tests/Musoq.Converter.Targets.Tests.csproj --configuration Release --no-restore --no-dependencies -warnaserror
          dotnet build src/dotnet/Musoq.Converter.Tests.Common/Musoq.Converter.Tests.Common.csproj --configuration Release --no-restore --no-dependencies -warnaserror
          dotnet build src/dotnet/Musoq.Evaluator.Query.Tests/Musoq.Evaluator.Query.Tests.csproj --configuration Release --no-restore --no-dependencies -warnaserror
          dotnet build src/dotnet/Musoq.Evaluator.Relational.Tests/Musoq.Evaluator.Relational.Tests.csproj --configuration Release --no-restore --no-dependencies -warnaserror
          dotnet build src/dotnet/Musoq.Evaluator.Planning.Tests/Musoq.Evaluator.Planning.Tests.csproj --configuration Release --no-restore --no-dependencies -warnaserror
          dotnet build src/dotnet/Musoq.Evaluator.CodeGeneration.Tests/Musoq.Evaluator.CodeGeneration.Tests.csproj --configuration Release --no-restore --no-dependencies -warnaserror
          dotnet build src/dotnet/Musoq.Evaluator.Tests.Common/Musoq.Evaluator.Tests.Common.csproj --configuration Release --no-restore --no-dependencies -warnaserror
          dotnet build src/dotnet/Musoq.Evaluator.Interpretation.Tests/Musoq.Evaluator.Interpretation.Tests.csproj --configuration Release --no-restore --no-dependencies -warnaserror
          dotnet build src/dotnet/Musoq.Evaluator.Diagnostics.Tests/Musoq.Evaluator.Diagnostics.Tests.csproj --configuration Release --no-restore --no-dependencies -warnaserror
          dotnet build src/dotnet/Musoq.Evaluator.Runtime.Tests/Musoq.Evaluator.Runtime.Tests.csproj --configuration Release --no-restore --no-dependencies -warnaserror
          dotnet build src/dotnet/Musoq.Benchmarks/Musoq.Benchmarks.csproj --configuration Release --no-restore --no-dependencies -warnaserror
          dotnet build src/dotnet/Musoq.Benchmarks.Scenarios/Musoq.Benchmarks.Scenarios.csproj --configuration Release --no-restore --no-dependencies -warnaserror
          dotnet build src/dotnet/Musoq.Benchmarks.Tests/Musoq.Benchmarks.Tests.csproj --configuration Release --no-restore --no-dependencies -warnaserror
          dotnet build src/dotnet/Musoq.Playground/Musoq.Playground.csproj --configuration Release --no-restore --no-dependencies -warnaserror

      - name: Test
        env:
          VSTEST_CONNECTION_TIMEOUT: '180'
        run: dotnet test src/dotnet/Musoq.sln --configuration Release --no-build --logger "console;verbosity=minimal" --logger "trx;LogFileName=test-results.trx"

      - name: Pack release packages
        if: matrix.warning_ratchet == true
        shell: pwsh
        run: |
          $packScript = Join-Path $env:GITHUB_WORKSPACE 'scripts/release/Pack-Release.ps1'
          $outputPath = Join-Path $env:GITHUB_WORKSPACE '.artifacts/ci-nupkgs'
          & $packScript -AllPackages -OutputPath $outputPath

      - name: Check release tooling
        if: matrix.warning_ratchet == true
        shell: pwsh
        run: |
          & ./scripts/release/Test-ReleaseScripts.ps1

      - name: Publish TRX artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: src/dotnet/**/TestResults/*.trx
          if-no-files-found: error
          retention-days: 1
